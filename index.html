<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akses Tes Kecerdasan</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#0b0b0b;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    color:#111;
    padding:30px;
    border-radius:14px;
    width:340px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:2px solid #ddd;
    border-radius:8px;
    text-align:center;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px;
    width:100%;
    background:black;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.menu{
    display:none;
    flex-direction:column;
    gap:10px;
}

.menu a{
    display:block;
    padding:12px;
    background:#f2f2f2;
    border-radius:8px;
    text-decoration:none;
    color:#111;
    font-weight:bold;
}

.error{
    color:red;
    font-size:13px;
}

.info{
    font-size:12px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

    <!-- LOGIN -->
    <div id="login">
        <h3>AKSES TES KECERDASAN</h3>
        <input type="password" id="pass" placeholder="Masukkan Password">
        <button onclick="login()">MASUK</button>
        <div id="error" class="error"></div>
    </div>

    <!-- MENU -->
    <div id="menu" class="menu">
        <h3>PILIH TES</h3>

        <a href="kecerdasan_7_hitungan_arahmataangin.html">
            Tes Arah Mata Angin
        </a>

        <a href="kecerdasan_2.html">
            Tes Kecerdasan Logika
        </a>

        <div id="expireInfo" class="info"></div>
    </div>

</div>

<script>

const PASSWORD = "persona05";
const EXPIRE_DAYS = 7;

// LOGIN
function login(){
    let input = document.getElementById("pass").value;

    if(input !== PASSWORD){
        document.getElementById("error").innerText = "Password salah!";
        return;
    }

    if(isExpired()){
        document.getElementById("error").innerText = "Akses sudah expired!";
        return;
    }

    startSession();

    localStorage.setItem("LOGIN_OK","true");

    document.getElementById("login").style.display = "none";
    document.getElementById("menu").style.display = "flex";

    showExpire();
}

// SIMPAN WAKTU PERTAMA
function startSession(){
    if(!localStorage.getItem("start_time")){
        localStorage.setItem("start_time", new Date().getTime());
    }
}

// CEK EXPIRED
function isExpired(){
    let start = localStorage.getItem("start_time");
    if(!start) return false;

    let now = new Date().getTime();
    let days = (now - start) / (1000*60*60*24);

    return days > EXPIRE_DAYS;
}

// TAMPILKAN EXPIRE
function showExpire(){
    let start = localStorage.getItem("start_time");
    if(!start) return;

    let expire = new Date(parseInt(start) + (EXPIRE_DAYS*24*60*60*1000));

    document.getElementById("expireInfo").innerText =
        "Berlaku sampai: " + expire.toLocaleDateString();
}

</script>

</body>
</html>
